[build]
  build = "npm run build"
  publish = "dist"

# Password-protected route first
[[redirects]]
  from = "/protected/*"
  to = "/index.html"
  status = 200
  force = true
  headers = { Authorization = "Basic" }

# SPA fallback for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
